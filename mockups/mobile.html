<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ironclad Bastion - Tower Defense HUD</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Public+Sans:wght@700;800&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "rivet-bronze": "#999077",
                        "surface-dim": "#091421",
                        "background": "#091421",
                        "secondary-fixed-dim": "#ffb77a",
                        "surface-deep": "#091421",
                        "on-secondary-fixed": "#2e1500",
                        "on-secondary-container": "#efa96d",
                        "surface-steel": "#212b39",
                        "primary-fixed": "#ffe16d",
                        "hazard-red": "#ffb4ab",
                        "on-error": "#690005",
                        "surface-container-lowest": "#050f1c",
                        "tertiary": "#d8ffe7",
                        "surface-container-low": "#121c2a",
                        "on-primary-fixed-variant": "#544600",
                        "primary-fixed-dim": "#e9c400",
                        "surface-container-highest": "#2b3544",
                        "on-secondary-fixed-variant": "#6b3b05",
                        "on-tertiary-container": "#006d4a",
                        "surface-bright": "#303a49",
                        "tertiary-fixed": "#6ffbbe",
                        "secondary-container": "#6e3d08",
                        "error": "#ffb4ab",
                        "surface-container-high": "#212a39",
                        "on-tertiary-fixed": "#002113",
                        "on-secondary": "#4c2700",
                        "surface": "#091421",
                        "outline-variant": "#4d4732",
                        "inverse-primary": "#705d00",
                        "inverse-on-surface": "#273140",
                        "tertiary-fixed-dim": "#4fdea3",
                        "on-background": "#d9e3f6",
                        "secondary": "#ffb77a",
                        "on-surface": "#d9e3f6",
                        "on-primary-fixed": "#221b00",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#2b3544",
                        "secondary-fixed": "#ffdcc2",
                        "on-primary": "#3a3000",
                        "error-container": "#93000a",
                        "inverse-surface": "#d9e3f6",
                        "on-tertiary": "#003824",
                        "on-primary-container": "#705e00",
                        "surface-container": "#16202e",
                        "primary-container": "#ffd700",
                        "primary": "#fff6df",
                        "on-surface-variant": "#d0c6ab",
                        "on-tertiary-fixed-variant": "#005236",
                        "tertiary-container": "#65f2b5",
                        "hologram-glow": "rgba(255, 215, 0, 0.3)",
                        "outline": "#999077",
                        "surface-tint": "#e9c400"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "gutter": "16px",
                        "unit": "4px",
                        "rivet-offset": "8px",
                        "margin-safe": "32px",
                        "panel-padding": "24px"
                    },
                    fontFamily: {
                        "label-xs": ["JetBrains Mono"],
                        "headline-sm": ["Public Sans"],
                        "headline-xl": ["Public Sans"],
                        "headline-lg": ["Public Sans"],
                        "number-display": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "label-xs": ["10px", { "lineHeight": "12px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "0.1em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "number-display": ["24px", { "lineHeight": "32px", "letterSpacing": "0px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.15em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .bevel-panel {
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.1), inset -1px -1px 0 rgba(0,0,0,0.5);
        }
        .recessed-slot {
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
        }
        .hud-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden font-body-md flex flex-col relative">
<!-- Background Layer (Game Board Placeholder / Grid) -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-surface-dim hud-grid"></div>
<img alt="Isometric game board background" class="w-full h-full object-cover opacity-30 mix-blend-overlay" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCy787n-He5ZpZ6W0XJsAPUKbEweDHX2SCCuz7_GfHHm_TL09r3Nq24lC1So_yPdnHdmR231JhUmzgKwVYuQsU-6fWPrRFmNfk0_TK_TIlsX9UjrJyPFHzISQjLMLLyuDK9jNX3nlkjtDqtB8AkgCue0I3M1LScnfCTkFcnGp2n3rE7-Yczgt1DhYZzN61rTmKlxGIj5sT9dfnGu-fzKZOdFaplx6DftC2xqJIlVhhjGJBAVdJ0ZaguNDKM-dwhtrBQ0A"/>
</div>
<!-- Main HUD Container -->
<div class="relative z-10 flex flex-col h-full pointer-events-none">
<!-- TopAppBar: Royal Treasury (from JSON) -->
<header class="bg-surface-dim dark:bg-surface-dim border-b-2 border-rivet-bronze shadow-[inset_0_-2px_4px_rgba(0,0,0,0.5)] shadow-lg flex justify-between items-center w-full px-margin-safe h-20 pointer-events-auto shrink-0 relative z-50">
<!-- Rivets -->
<div class="absolute top-2 left-2 w-1.5 h-1.5 rounded-full bg-rivet-bronze shadow-inner opacity-80"></div>
<div class="absolute bottom-2 left-2 w-1.5 h-1.5 rounded-full bg-rivet-bronze shadow-inner opacity-80"></div>
<div class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-rivet-bronze shadow-inner opacity-80"></div>
<div class="absolute bottom-2 right-2 w-1.5 h-1.5 rounded-full bg-rivet-bronze shadow-inner opacity-80"></div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-surface-container-high rounded-lg flex items-center justify-center recessed-slot border border-surface-steel">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed tracking-widest uppercase">Royal Treasury</h1>
</div>
<div class="flex items-center">
<div class="bg-surface-container-highest px-4 py-2 rounded-lg recessed-slot border-t border-surface-steel/50 flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
<span class="font-number-display text-number-display text-primary-fixed dark:text-primary-fixed-dim tracking-tight">1,250 GOLD</span>
</div>
</div>
</header>
<!-- Center Canvas Area -->
<main class="flex-grow flex items-center justify-center relative pointer-events-none">
<!-- Large Action Button: START WAVE -->
<div class="absolute right-margin-safe bottom-32 pointer-events-auto">
<button class="group relative overflow-hidden bg-tertiary/10 backdrop-blur-md border-2 border-tertiary hover:bg-tertiary/20 transition-all duration-300 rounded-xl px-8 py-6 shadow-[0_0_20px_rgba(216,255,231,0.2)] hover:shadow-[0_0_30px_rgba(216,255,231,0.4)] hover:-translate-y-1 active:translate-y-[2px] bevel-panel flex flex-col items-center gap-2">
<div class="absolute inset-0 bg-gradient-to-t from-tertiary/5 to-transparent pointer-events-none"></div>
<!-- Rivets -->
<div class="absolute top-2 left-2 w-1 h-1 rounded-full bg-tertiary shadow-inner opacity-80"></div>
<div class="absolute top-2 right-2 w-1 h-1 rounded-full bg-tertiary shadow-inner opacity-80"></div>
<div class="absolute bottom-2 left-2 w-1 h-1 rounded-full bg-tertiary shadow-inner opacity-80"></div>
<div class="absolute bottom-2 right-2 w-1 h-1 rounded-full bg-tertiary shadow-inner opacity-80"></div>
<span class="material-symbols-outlined text-tertiary text-4xl" style="font-variation-settings: 'FILL' 1;">swords</span>
<span class="font-headline-lg text-headline-lg text-tertiary tracking-widest relative z-10 drop-shadow-md">START WAVE</span>
<div class="bg-surface-container-lowest/50 px-3 py-1 rounded border border-tertiary/30 mt-2">
<span class="font-label-caps text-label-caps text-tertiary/70">[SPACE]</span>
</div>
</button>
</div>
<!-- Contextual Build Preview (Simulated) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 hidden md:flex flex-col items-center gap-2 pointer-events-none opacity-60">
<div class="bg-surface-container-high/80 border border-primary-fixed/50 backdrop-blur-sm px-4 py-2 rounded-lg text-center bevel-panel shadow-lg">
<span class="font-label-caps text-label-caps text-primary-fixed block mb-1">SELECT TILE</span>
<span class="font-body-md text-on-surface-variant block text-sm">Deploy defenses to protect the keep.</span>
</div>
</div>
</main>
<!-- Bottom Menu: Build Menu (Adapted from BottomNavBar JSON, but styled as Build Menu) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-col justify-end items-center pointer-events-auto bg-surface-container-high dark:bg-surface-container-highest border-t-2 border-rivet-bronze shadow-[0_-4px_10px_rgba(0,0,0,0.6)] rounded-t-xl pb-margin-safe pt-4 px-4 relative">
<!-- Menu Label -->
<div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-surface-dim border-2 border-rivet-bronze px-6 py-1 rounded-t-lg shadow-[inset_0_2px_4px_rgba(255,255,255,0.05)]">
<span class="font-label-caps text-label-caps text-rivet-bronze tracking-widest">KINGDOM BUILD MENU</span>
</div>
<!-- Rivets -->
<div class="absolute top-4 left-4 w-2 h-2 rounded-full bg-rivet-bronze shadow-inner opacity-80"></div>
<div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-rivet-bronze shadow-inner opacity-80"></div>
<div class="flex justify-around items-end w-full max-w-4xl mx-auto gap-4">
<!-- Build Item 1: Stone Wall (Active) -->
<button class="group flex flex-col items-center gap-2 flex-1 max-w-[120px] transition-transform hover:scale-105 active:translate-y-[2px] active:scale-95 duration-100">
<div class="w-full aspect-square bg-secondary-container rounded-lg border-2 border-primary-fixed shadow-[0_0_15px_rgba(255,215,0,0.3)] bevel-panel relative overflow-hidden flex items-center justify-center p-2">
<!-- Active Glow -->
<div class="absolute inset-0 bg-primary-fixed/10 animate-pulse"></div>
<span class="material-symbols-outlined text-on-secondary-container text-4xl relative z-10" style="font-variation-settings: 'FILL' 1;">foundation</span>
<!-- Cost Badge -->
<div class="absolute bottom-1 right-1 bg-surface-dim border border-primary/30 rounded px-1 flex items-center z-20">
<span class="font-label-xs text-label-xs text-primary-fixed">50</span>
</div>
</div>
<span class="font-label-caps text-label-caps text-primary text-center">Wall</span>
</button>
<!-- Build Item 2: Archer Tower (Inactive) -->
<button class="group flex flex-col items-center gap-2 flex-1 max-w-[120px] transition-transform hover:scale-105 active:translate-y-[2px] active:scale-95 duration-100 opacity-70 hover:opacity-100">
<div class="w-full aspect-square bg-surface-bright rounded-lg border border-outline-variant shadow-md bevel-panel relative overflow-hidden flex items-center justify-center p-2">
<span class="material-symbols-outlined text-rivet-bronze text-4xl" style="font-variation-settings: 'FILL' 1;">castle</span>
<!-- Cost Badge -->
<div class="absolute bottom-1 right-1 bg-surface-dim border border-outline-variant/50 rounded px-1 flex items-center z-20">
<span class="font-label-xs text-label-xs text-rivet-bronze">150</span>
</div>
</div>
<span class="font-label-caps text-label-caps text-rivet-bronze text-center">Archer</span>
</button>
<!-- Build Item 3: Wizard Tower (Inactive) -->
<button class="group flex flex-col items-center gap-2 flex-1 max-w-[120px] transition-transform hover:scale-105 active:translate-y-[2px] active:scale-95 duration-100 opacity-70 hover:opacity-100">
<div class="w-full aspect-square bg-surface-bright rounded-lg border border-outline-variant shadow-md bevel-panel relative overflow-hidden flex items-center justify-center p-2">
<span class="material-symbols-outlined text-rivet-bronze text-4xl" style="font-variation-settings: 'FILL' 1;">shield</span>
<!-- Cost Badge -->
<div class="absolute bottom-1 right-1 bg-surface-dim border border-outline-variant/50 rounded px-1 flex items-center z-20">
<span class="font-label-xs text-label-xs text-rivet-bronze">300</span>
</div>
</div>
<span class="font-label-caps text-label-caps text-rivet-bronze text-center">Wizard</span>
</button>
<!-- Build Item 4: Catapult (Inactive, Too Expensive) -->
<button class="group flex flex-col items-center gap-2 flex-1 max-w-[120px] transition-transform hover:scale-105 active:translate-y-[2px] active:scale-95 duration-100 opacity-50 cursor-not-allowed">
<div class="w-full aspect-square bg-surface-container-low rounded-lg border border-error/30 shadow-inner recessed-slot relative overflow-hidden flex items-center justify-center p-2">
<!-- Hazard Stripe Background for unaffordable -->
<div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, var(--tw-colors-error) 10px, var(--tw-colors-error) 20px);"></div>
<span class="material-symbols-outlined text-surface-variant text-4xl" style="font-variation-settings: 'FILL' 1;">swords</span>
<!-- Cost Badge (Red) -->
<div class="absolute bottom-1 right-1 bg-error-container border border-error rounded px-1 flex items-center z-20">
<span class="font-label-xs text-label-xs text-on-error-container">1500</span>
</div>
</div>
<span class="font-label-caps text-label-caps text-error text-center">Catapult</span>
</button>
<!-- Build Item 5: Keep Upgrades (Inactive) -->
<button class="group flex flex-col items-center gap-2 flex-1 max-w-[120px] transition-transform hover:scale-105 active:translate-y-[2px] active:scale-95 duration-100 opacity-70 hover:opacity-100">
<div class="w-full aspect-square bg-surface-bright rounded-lg border border-outline-variant shadow-md bevel-panel relative overflow-hidden flex items-center justify-center p-2">
<span class="material-symbols-outlined text-rivet-bronze text-4xl" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
<span class="font-label-caps text-label-caps text-rivet-bronze text-center">Keep</span>
</button>
</div>
</nav>
</div>
</body></html>
