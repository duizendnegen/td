<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ironclad Bastion - Command Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Public+Sans:wght@700;800&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "rivet-bronze": "#999077",
                      "surface-dim": "#091421",
                      "background": "#091421",
                      "secondary-fixed-dim": "#ffb77a",
                      "surface-deep": "#091421",
                      "on-secondary-fixed": "#2e1500",
                      "on-secondary-container": "#efa96d",
                      "surface-steel": "#212b39",
                      "primary-fixed": "#ffe16d",
                      "hazard-red": "#ffb4ab",
                      "on-error": "#690005",
                      "surface-container-lowest": "#050f1c",
                      "tertiary": "#d8ffe7",
                      "surface-container-low": "#121c2a",
                      "on-primary-fixed-variant": "#544600",
                      "primary-fixed-dim": "#e9c400",
                      "surface-container-highest": "#2b3544",
                      "on-secondary-fixed-variant": "#6b3b05",
                      "on-tertiary-container": "#006d4a",
                      "surface-bright": "#303a49",
                      "tertiary-fixed": "#6ffbbe",
                      "secondary-container": "#6e3d08",
                      "error": "#ffb4ab",
                      "surface-container-high": "#212a39",
                      "on-tertiary-fixed": "#002113",
                      "on-secondary": "#4c2700",
                      "surface": "#091421",
                      "outline-variant": "#4d4732",
                      "inverse-primary": "#705d00",
                      "inverse-on-surface": "#273140",
                      "tertiary-fixed-dim": "#4fdea3",
                      "on-background": "#d9e3f6",
                      "secondary": "#ffb77a",
                      "on-surface": "#d9e3f6",
                      "on-primary-fixed": "#221b00",
                      "on-error-container": "#ffdad6",
                      "surface-variant": "#2b3544",
                      "secondary-fixed": "#ffdcc2",
                      "on-primary": "#3a3000",
                      "error-container": "#93000a",
                      "inverse-surface": "#d9e3f6",
                      "on-tertiary": "#003824",
                      "on-primary-container": "#705e00",
                      "surface-container": "#16202e",
                      "primary-container": "#ffd700",
                      "primary": "#fff6df",
                      "on-surface-variant": "#d0c6ab",
                      "on-tertiary-fixed-variant": "#005236",
                      "tertiary-container": "#65f2b5",
                      "hologram-glow": "rgba(255, 215, 0, 0.3)",
                      "outline": "#999077",
                      "surface-tint": "#e9c400"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "gutter": "16px",
                      "unit": "4px",
                      "rivet-offset": "8px",
                      "margin-safe": "32px",
                      "panel-padding": "24px"
              },
              "fontFamily": {
                      "label-xs": [
                              "JetBrains Mono"
                      ],
                      "headline-sm": [
                              "Public Sans"
                      ],
                      "headline-xl": [
                              "Public Sans"
                      ],
                      "headline-lg": [
                              "Public Sans"
                      ],
                      "number-display": [
                              "JetBrains Mono"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ]
              },
              "fontSize": {
                      "label-xs": [
                              "10px",
                              {
                                      "lineHeight": "12px",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-sm": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-xl": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "0.1em",
                                      "fontWeight": "800"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "number-display": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "0px",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.15em",
                                      "fontWeight": "500"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        .bevel-panel {
            box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.1), inset -1px -1px 0px rgba(0, 0, 0, 0.5);
        }
        .recessed-slot {
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.6);
        }
        .hazard-stripe {
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 10px,
                rgba(255, 180, 171, 0.1) 10px,
                rgba(255, 180, 171, 0.1) 20px
            );
        }
        .rivet {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: theme('colors.surface-bright');
            border-radius: 50%;
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.8), inset 1px 1px 2px rgba(255,255,255,0.2);
            border: 1px solid theme('colors.surface-dim');
        }
        .rivet-tl { top: 6px; left: 6px; }
        .rivet-tr { top: 6px; right: 6px; }
        .rivet-bl { bottom: 6px; left: 6px; }
        .rivet-br { bottom: 6px; right: 6px; }
        
        /* Custom scrollbar for mechanical feel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface-dim');
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.surface-bright');
            border: 1px solid theme('colors.rivet-bronze');
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-md select-none relative">
<!-- Game Board Canvas Background -->
<div class="absolute inset-0 z-0 bg-surface-deep overflow-hidden flex items-center justify-center">
<!-- Abstract Isometric Grid Representation -->
<div class="w-[200%] h-[200%] absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-20 pointer-events-none" style="background-image: linear-gradient(theme('colors.surface-bright') 1px, transparent 1px), linear-gradient(90deg, theme('colors.surface-bright') 1px, transparent 1px); background-size: 64px 64px; transform: rotateX(60deg) rotateZ(45deg);"></div>
<!-- Central Focus Area (Placeholder for game action) -->
<div class="w-96 h-96 border-2 border-primary/20 rounded-full blur-xl absolute"></div>
</div>
<!-- Top Navigation Anchor (Shared Component) -->
<!-- name: TopAppBar, type: medium -->
<header class="relative z-40 bg-surface-dim border-b-2 border-rivet-bronze shadow-[inset_0_-2px_4px_rgba(0,0,0,0.5)] flex justify-between items-center w-full px-margin-safe h-20 shadow-lg">
<!-- Brand / Leading -->
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary-fixed text-3xl">account_balance_wallet</span>
<h1 class="font-headline-sm text-headline-sm text-primary uppercase tracking-wider">Royal Treasury</h1>
</div>
<!-- Trailing Action / Stats -->
<div class="recessed-slot bg-surface-container-lowest px-6 py-3 rounded-DEFAULT border border-surface-bright flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed animate-pulse">monetization_on</span>
<span class="font-number-display text-number-display text-primary-fixed-dim tracking-tight">1,250</span>
<span class="font-label-caps text-label-caps text-on-surface-variant ml-1">GOLD</span>
</div>
</header>
<!-- Main HUD Content Area -->
<main class="relative z-30 flex-1 w-full flex justify-between items-stretch p-margin-safe pointer-events-none">
<!-- Left Panel: Tower Palette -->
<aside class="w-24 flex flex-col gap-unit pointer-events-auto">
<!-- Build Palette Container -->
<div class="bg-surface-container-high rounded-lg p-unit flex flex-col gap-unit bevel-panel relative">
<!-- Rivets -->
<div class="rivet rivet-tl"></div>
<div class="rivet rivet-tr"></div>
<div class="text-center pb-2 pt-1 border-b border-surface-bright/50 mb-2">
<span class="font-label-caps text-label-xs text-on-surface-variant">BUILD</span>
</div>
<!-- Palette Item: Active -->
<button class="w-16 h-16 mx-auto bg-surface-dim rounded border-2 border-primary-fixed shadow-[0_0_15px_rgba(255,215,0,0.3)] flex items-center justify-center relative group transition-all translate-y-[2px]">
<span class="material-symbols-outlined text-primary-fixed text-3xl">fort</span>
<div class="absolute -right-2 -bottom-2 bg-surface-container-lowest text-primary-fixed font-label-xs text-label-xs px-1 rounded border border-primary-fixed">150</div>
</button>
<!-- Palette Item: Inactive -->
<button class="w-16 h-16 mx-auto bg-surface rounded border border-surface-bright hover:bg-surface-bright transition-colors flex items-center justify-center relative group">
<span class="material-symbols-outlined text-on-surface-variant text-3xl group-hover:text-primary-fixed/70 transition-colors">swords</span>
<div class="absolute -right-2 -bottom-2 bg-surface-container text-on-surface-variant font-label-xs text-label-xs px-1 rounded border border-surface-bright">200</div>
</button>
<!-- Palette Item: Inactive -->
<button class="w-16 h-16 mx-auto bg-surface rounded border border-surface-bright hover:bg-surface-bright transition-colors flex items-center justify-center relative group">
<span class="material-symbols-outlined text-on-surface-variant text-3xl group-hover:text-primary-fixed/70 transition-colors">shield</span>
<div class="absolute -right-2 -bottom-2 bg-surface-container text-on-surface-variant font-label-xs text-label-xs px-1 rounded border border-surface-bright">350</div>
</button>
<!-- Palette Item: Disabled (Too expensive) -->
<button class="w-16 h-16 mx-auto bg-surface/50 rounded border border-surface-bright/50 flex items-center justify-center relative cursor-not-allowed opacity-50">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">castle</span>
<div class="absolute -right-2 -bottom-2 bg-error-container text-on-error-container font-label-xs text-label-xs px-1 rounded border border-error">1500</div>
</button>
<div class="rivet rivet-bl"></div>
<div class="rivet rivet-br"></div>
</div>
</aside>
<!-- Right Panel: Tower Inspector -->
<aside class="w-80 flex flex-col justify-start pointer-events-auto">
<div class="bg-surface-container-high rounded-xl p-panel-padding bevel-panel border border-rivet-bronze/30 relative flex flex-col gap-6 shadow-2xl">
<!-- Rivets -->
<div class="rivet rivet-tl"></div>
<div class="rivet rivet-tr"></div>
<div class="rivet rivet-bl"></div>
<div class="rivet rivet-br"></div>
<!-- Inspector Header -->
<div class="flex items-start justify-between border-b border-surface-bright pb-4">
<div>
<h2 class="font-headline-sm text-headline-sm text-primary uppercase">Archer Tower</h2>
<span class="font-label-caps text-label-caps text-secondary-fixed-dim">LEVEL 2 STRUCTURE</span>
</div>
<div class="w-12 h-12 rounded bg-surface-dim flex items-center justify-center border border-surface-bright recessed-slot">
<span class="material-symbols-outlined text-secondary-fixed-dim text-2xl">fort</span>
</div>
</div>
<!-- Stats Container -->
<div class="flex flex-col gap-4">
<!-- Stat: Damage -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">swords</span> Arrow Damage
                            </span>
<span class="font-number-display text-[18px] text-primary">45</span>
</div>
<div class="h-2 w-full bg-surface-dim rounded-full recessed-slot overflow-hidden">
<div class="h-full bg-secondary-fixed-dim w-[45%]" style="box-shadow: inset 0 1px 2px rgba(255,255,255,0.3)"></div>
</div>
</div>
<!-- Stat: Fire Rate -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">speed</span> Fire Rate
                            </span>
<span class="font-number-display text-[18px] text-primary">1.2s</span>
</div>
<div class="h-2 w-full bg-surface-dim rounded-full recessed-slot overflow-hidden">
<div class="h-full bg-tertiary-fixed-dim w-[60%]" style="box-shadow: inset 0 1px 2px rgba(255,255,255,0.3)"></div>
</div>
</div>
<!-- Stat: Range -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-end">
<span class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">my_location</span> Range
                            </span>
<span class="font-number-display text-[18px] text-primary">120</span>
</div>
<div class="h-2 w-full bg-surface-dim rounded-full recessed-slot overflow-hidden">
<div class="h-full bg-primary-fixed-dim w-[75%]" style="box-shadow: inset 0 1px 2px rgba(255,255,255,0.3)"></div>
</div>
</div>
</div>
<!-- Actions Container -->
<div class="flex flex-col gap-3 mt-2">
<!-- Primary Action: Upgrade -->
<button class="w-full bg-secondary-container hover:bg-secondary-container/80 text-on-secondary-container font-headline-sm text-headline-sm py-3 rounded border-2 border-secondary-fixed-dim shadow-[0_0_10px_rgba(255,183,122,0.2)] transition-all hover:translate-y-[1px] active:translate-y-[2px] flex items-center justify-center gap-2 relative overflow-hidden group">
<!-- Hologram glare effect -->
<div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
<span class="material-symbols-outlined">upgrade</span>
                        UPGRADE
                        <span class="bg-surface-dim/50 px-2 py-0.5 rounded text-sm ml-2 font-number-display text-secondary-fixed border border-secondary-fixed-dim/30">150G</span>
</button>
<!-- Secondary Action: Dismantle -->
<button class="w-full bg-surface-dim hover:bg-error-container/20 text-on-surface font-label-caps text-label-caps py-2 rounded border border-surface-bright hover:border-error transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">delete</span>
                        DISMANTLE
                        <span class="text-tertiary-fixed-dim ml-1">+75G</span>
</button>
</div>
</div>
</aside>
</main>
<!-- Bottom Navigation Shell (Hidden on Web/Desktop as per mandate, visible on mobile) -->
<!-- name: BottomNavBar, type: icons_only -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container-high border-t-2 border-rivet-bronze rounded-t-xl shadow-[0_-4px_10px_rgba(0,0,0,0.6)]">
<button class="flex flex-col items-center justify-center text-rivet-bronze p-2 opacity-70 hover:bg-surface-bright hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl">foundation</span>
</button>
<button class="flex flex-col items-center justify-center text-rivet-bronze p-2 opacity-70 hover:bg-surface-bright hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl">castle</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-lg p-2 border-2 border-primary-fixed shadow-[0_0_15px_rgba(255,215,0,0.3)] translate-y-[2px] scale-95 duration-100">
<span class="material-symbols-outlined text-2xl text-primary">shield</span>
</button>
<button class="flex flex-col items-center justify-center text-rivet-bronze p-2 opacity-70 hover:bg-surface-bright hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl">swords</span>
</button>
<button class="flex flex-col items-center justify-center text-rivet-bronze p-2 opacity-70 hover:bg-surface-bright hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl">settings</span>
</button>
</nav>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
</body></html>
