# THROWAWAY spike workflow for the PR wave preview feasibility probe
# (openspec change add-pr-wave-preview, tasks 1.2-1.5). Deleted at task 2.2.
name: spike-probe

# Dispatch-only after the first verified run, so pushes during later phases
# don't re-post probe comments.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run feasibility probe
        run: node .github/capture/probe.mjs
      # ubuntu-24.04 runner images no longer preinstall ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Encode animated WebP
        run: |
          ffmpeg -y -framerate 10 -i .github/capture/out/frame-%03d.png \
            -c:v libwebp -lossless 0 -q:v 80 -loop 0 probe.webp
          ls -la probe.webp
      - name: Push clip to ci-media
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=${GITHUB_SHA::7}
          FILE="spike/probe-${SHORT}.webp"
          cd "$RUNNER_TEMP"
          if git clone --depth 1 -b ci-media \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media 2>/dev/null; then
            cd media
          else
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media
            cd media
            git switch --orphan ci-media
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p spike
          cp "$GITHUB_WORKSPACE/probe.webp" "$FILE"
          git add "$FILE"
          git commit -m "spike: probe clip ${SHORT}"
          git push origin ci-media
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-media/${FILE}" >> "$GITHUB_OUTPUT"
      # Finding from the first run: GitHub does NOT proxy raw.githubusercontent.com
      # through Camo — the PR page embeds the raw URL directly. So the check is:
      # (a) raw serves image/webp with an ANIM chunk, (b) the rendered PR page
      # contains an <img> pointing at it.
      - name: Comment on PR and verify the embed serves animated WebP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="${{ steps.media.outputs.url }}"
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' || true)
          if [ -z "$PR" ]; then
            echo "No PR for $GITHUB_REF_NAME — raw clip at $URL"
            exit 0
          fi
          BODY="**[spike-probe — throwaway]** animated WebP probe for ${GITHUB_SHA::7}:

          ![probe clip](${URL})

          If this renders as a short animated zoom, the embed path works."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" --jq '.id'
          sleep 5
          CTYPE=$(curl -sSI "$URL" | tr -d '\r' | grep -i '^content-type:' | head -1)
          echo "raw serves: $CTYPE"
          curl -sSL "$URL" -o served.webp
          head -c 512 served.webp | grep -aq ANIM || { echo "EMBED CHECK: FAIL — no ANIM chunk"; exit 1; }
          PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/${PR}"
          curl -sL "$PR_URL" | grep -oq "<img src=\"${URL}\"" \
            && echo "EMBED CHECK: PASS — PR page embeds the raw animated WebP directly" \
            || { echo "EMBED CHECK: FAIL — no <img> for $URL on $PR_URL"; exit 1; }
      - name: Upload probe outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-probe-output
          path: |
            .github/capture/out/
            probe.webp
